<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101018"><title>Local Chat</title>
<style>
:root{color-scheme:dark;--bg:#101018;--panel:#191923;--raised:#22222e;--line:#393947;--text:#f4f2fa;--muted:#b6b3c4;--purple:#a78bfa;--cyan:#67e8f9;--red:#fda4af;font:16px system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg)}button,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100dvh;display:flex;flex-direction:column}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:#101018f2;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;min-width:0}.mark{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:#30234e;color:var(--purple)}.mark svg{width:21px}.brand-name{font-weight:650}.connection{display:flex;align-items:center;gap:7px;margin-top:2px;color:var(--muted);font-size:.76rem}.dot{width:7px;height:7px;border-radius:50%;background:#4ade80}.dot.off{background:#fb7185}.actions{display:flex;gap:8px;align-items:center}select,.quiet{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)}select{max-width:43vw;padding:0 28px 0 10px}.quiet{padding:0 12px;color:var(--muted)}button:hover,select:hover{border-color:#69647d}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}main{width:min(100%,860px);margin:0 auto;padding:28px 18px 180px;flex:1}#messages{display:flex;flex-direction:column;gap:24px}.welcome{min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 10px}.welcome-mark{width:58px;height:58px;display:grid;place-items:center;border:1px solid #514476;border-radius:20px;background:#241d38;color:var(--purple);margin-bottom:18px}.welcome-mark svg{width:29px}h1{margin:0 0 10px;font-size:clamp(1.6rem,5vw,2.15rem);line-height:1.2;letter-spacing:-.035em}.welcome p{max-width:430px;margin:0;color:var(--muted);line-height:1.55}.message{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;animation:appear .18s ease-out}.avatar{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:.72rem;font-weight:700}.assistant .avatar{background:#30234e;color:var(--purple)}.user .avatar{background:#263444;color:var(--cyan)}.content{min-width:0;padding-top:4px}.label{font-size:.8rem;font-weight:650;color:var(--muted);margin-bottom:7px}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.user .text{color:#e5e4ec}.composer-wrap{position:fixed;z-index:3;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:linear-gradient(transparent,var(--bg) 24%)}form{width:min(100%,820px);margin:auto;border:1px solid #484657;border-radius:20px;background:var(--raised);box-shadow:0 14px 40px #0004;padding:10px}textarea{display:block;width:100%;max-height:180px;min-height:44px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px;line-height:1.45}textarea::placeholder{color:#aaa8b9}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 2px 1px 10px}.hint{color:var(--muted);font-size:.76rem}.send{width:44px;height:44px;border:0;border-radius:14px;background:#7c3aed;color:#fff;display:grid;place-items:center}.send:hover{background:#6d28d9}.send:disabled{opacity:.45;cursor:not-allowed}.send svg{width:20px}.stop{display:none;width:auto;padding:0 13px;background:#49303b;color:#fecdd3}.stop.visible{display:inline-flex;align-items:center;gap:8px}.error{width:min(100%,820px);margin:9px auto 0;color:var(--red);font-size:.9rem}.typing{display:inline-flex;gap:4px;padding:8px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--purple);animation:pulse 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes pulse{0%,60%,100%{opacity:.35}30%{opacity:1;transform:translateY(-3px)}}@media(max-width:520px){header{padding-top:max(10px,env(safe-area-inset-top))}.brand-name{font-size:.95rem}.connection{font-size:.7rem}.quiet{padding:0 10px;font-size:.86rem}main{padding:18px 15px 170px}.message{grid-template-columns:30px minmax(0,1fr);gap:10px}.avatar{width:30px;height:30px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div class="app">
<header><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3.5 7 4v9l-7 4-7-4v-9l7-4Z"/><path d="m5.5 7.8 6.5 3.8 6.5-3.8M12 11.6v8.2"/></svg></div><div><div class="brand-name">Local Chat</div><div class="connection"><span id="dot" class="dot"></span><span id="status">Connecting to Ollama…</span></div></div></div><div class="actions"><label for="model" style="position:absolute;left:-9999px">Choose a model</label><select id="model" aria-label="Choose a model"></select><button id="clear" class="quiet" type="button">New chat</button></div></header>
<main><section id="welcome" class="welcome"><div class="welcome-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.2 2.2m8.4 8.4 2.2 2.2m0-12.8-2.2 2.2m-8.4 8.4-2.2 2.2"/><circle cx="12" cy="12" r="4"/></svg></div><h1>What would you like to explore?</h1><p>Your conversation runs locally through Ollama on this device. Choose a model and send a message to begin.</p></section><section id="messages" aria-live="polite" aria-label="Conversation"></section></main>
<div class="composer-wrap"><form id="form"><textarea id="prompt" rows="1" aria-label="Message" placeholder="Message your local model…" required></textarea><div class="bottom"><span class="hint">Enter to send · Shift+Enter for a new line</span><button id="send" class="send" type="submit" aria-label="Send message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button><button id="stop" class="send stop" type="button" aria-label="Stop response"><span aria-hidden="true">■</span> Stop</button></div></form><div id="error" class="error" role="alert" hidden></div></div>
</div>
<script>
(()=>{
const api='http://127.0.0.1:11434',modelEl=document.querySelector('#model'),messagesEl=document.querySelector('#messages'),welcome=document.querySelector('#welcome'),promptEl=document.querySelector('#prompt'),sendBtn=document.querySelector('#send'),stopBtn=document.querySelector('#stop'),errorEl=document.querySelector('#error'),status=document.querySelector('#status'),dot=document.querySelector('#dot');let history=[],controller=null;
function setStatus(ok,text){dot.classList.toggle('off',!ok);status.textContent=text}function err(text){errorEl.textContent=text;errorEl.hidden=false}function clearErr(){errorEl.textContent='';errorEl.hidden=true}
async function loadModels(){try{const r=await fetch(`${api}/api/tags`);if(!r.ok)throw Error(`Ollama returned ${r.status}`);const data=await r.json();modelEl.replaceChildren();for(const m of data.models||[]){const o=document.createElement('option');o.value=m.name;o.textContent=m.name;modelEl.append(o)}if(!modelEl.options.length){const o=document.createElement('option');o.textContent='No models installed';modelEl.append(o)}setStatus(true,'Ollama connected')}catch(e){setStatus(false,'Ollama unavailable');err(`Can’t reach Ollama at ${api}. Make sure “ollama serve” is running, then reload.`)}}
function add(role,text=''){welcome.hidden=true;const article=document.createElement('article');article.className=`message ${role}`;const avatar=document.createElement('div');avatar.className='avatar';avatar.setAttribute('aria-hidden','true');avatar.textContent=role==='user'?'You':'AI';const content=document.createElement('div');content.className='content';const label=document.createElement('div');label.className='label';label.textContent=role==='user'?'You':(modelEl.value||'Assistant');const body=document.createElement('div');body.className='text';body.textContent=text;content.append(label,body);article.append(avatar,content);messagesEl.append(article);article.scrollIntoView({block:'end',behavior:'smooth'});return{article,body}}
function busy(on){sendBtn.disabled=on;stopBtn.classList.toggle('visible',on);promptEl.disabled=on;modelEl.disabled=on}
async function send(text){const model=modelEl.value;if(!model||model==='No models installed'){err('No local models are installed. Pull a model with Ollama, then reload this page.');return}clearErr();history.push({role:'user',content:text});add('user',text);const assistant=add('assistant');const dots=document.createElement('span');dots.className='typing';dots.setAttribute('aria-label','Generating response');dots.innerHTML='<i></i><i></i><i></i>';assistant.body.append(dots);controller=new AbortController();busy(true);let reply='';try{const r=await fetch(`${api}/api/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages:history,stream:true}),signal:controller.signal});if(!r.ok)throw Error((await r.text())||`Ollama returned ${r.status}`);const reader=r.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const{value,done}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const lines=buffer.split('\n');buffer=lines.pop();for(const line of lines){if(!line.trim())continue;const chunk=JSON.parse(line);if(chunk.error)throw Error(chunk.error);if(chunk.message?.content){reply+=chunk.message.content;assistant.body.textContent=reply;assistant.article.scrollIntoView({block:'end',behavior:'smooth'})}}}if(buffer.trim()){const c=JSON.parse(buffer);if(c.message?.content)reply+=c.message.content}assistant.body.textContent=reply||(controller.signal.aborted?'Response stopped.':'No response text received.');history.push({role:'assistant',content:reply})}catch(e){if(e.name==='AbortError'){assistant.body.textContent=reply||'Response stopped.';if(reply)history.push({role:'assistant',content:reply})}else{assistant.article.remove();history.pop();err(`Request failed: ${e.message}`)}}finally{controller=null;busy(false);promptEl.focus()}}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const text=promptEl.value.trim();if(!text||controller)return;promptEl.value='';promptEl.style.height='auto';send(text)});promptEl.addEventListener('input',()=>{promptEl.style.height='auto';promptEl.style.height=`${Math.min(promptEl.scrollHeight,180)}px`});promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#form').requestSubmit()}});stopBtn.addEventListener('click',()=>controller?.abort());document.querySelector('#clear').addEventListener('click',()=>{controller?.abort();history=[];messagesEl.replaceChildren();welcome.hidden=false;clearErr();promptEl.focus()});loadModels()
})();
</script></body></html>
